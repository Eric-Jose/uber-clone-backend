name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter (if configured)
        run: npm run lint --if-present

      - name: Run tests (if configured)
        run: npm test --if-present
        env:
          NODE_ENV: test

      - name: Build project (if configured)
        run: npm run build --if-present
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-node-${{ matrix.node-version }}
          path: |
            dist/
            build/
          if-no-files-found: ignore
          retention-days: 5

      - name: Job summary
        if: always()
        run: |
          echo "### Build result for Node.js ${{ matrix.node-version }}: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"

  ci-status:
    name: CI Status Summary
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report overall status
        run: |
          echo "## CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Matrix result across Node.js 18, 20, 22: **${{ needs.build-and-test.result }}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "CI failed for one or more Node.js versions."
            exit 1
          fi
          echo "All Node.js versions passed successfully."
