name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache ~/.npm (additional layer)
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-node${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-cache-node${{ matrix.node-version }}-
            npm-cache-

      - name: Cache diagnostics
        run: |
          echo "Setup-node cache hit: ${{ steps.setup-node.outputs.cache-hit }}"
          echo "~/.npm cache hit: ${{ steps.npm-cache.outputs.cache-hit }}"

      - name: Report tool versions
        run: |
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"

      - name: Install dependencies (clean, reproducible)
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run linter (if configured)
        run: npm run lint --if-present

      - name: Run tests (if configured)
        run: npm test --if-present
        env:
          NODE_ENV: test

      - name: Build project (if configured)
        id: build
        run: |
          echo "build_start=$(date +%s)" >> "$GITHUB_ENV"
          npm run build --if-present
          build_end=$(date +%s)
          echo "Build duration: $((build_end - build_start))s"
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-node-${{ matrix.node-version }}
          path: |
            dist/
            build/
          if-no-files-found: ignore
          retention-days: 5

      - name: Job summary
        if: always()
        run: |
          echo "### Build result for Node.js ${{ matrix.node-version }}: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Setup-node cache hit: ${{ steps.setup-node.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ~/.npm cache hit: ${{ steps.npm-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"

  ci-status:
    name: CI Status Summary
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report overall status
        run: |
          echo "## CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Matrix result across Node.js 18, 20, 22: **${{ needs.build-and-test.result }}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "CI failed for one or more Node.js versions."
            exit 1
          fi
          echo "All Node.js versions passed successfully."
